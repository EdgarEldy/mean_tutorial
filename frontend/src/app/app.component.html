<mat-sidenav-container class="app-shell">
  <mat-sidenav
    #sidenav
    class="app-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <app-topbar (menuToggle)="sidenav.toggle()" />

    <main class="app-main">
      <router-outlet />
    </main>

    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>

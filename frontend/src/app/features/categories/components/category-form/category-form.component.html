<h2 mat-dialog-title>{{ isEditMode ? 'Edit category' : 'New category' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category name</mat-label>
      <input matInput formControlName="category_name" maxlength="255" />
      @if (form.controls.category_name.hasError('required')) {
        <mat-error>Category name is required.</mat-error>
      }
      @if (form.controls.category_name.hasError('maxlength')) {
        <mat-error>Category name must be 255 characters or fewer.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit">{{ isEditMode ? 'Save' : 'Create' }}</button>
  </mat-dialog-actions>
</form>

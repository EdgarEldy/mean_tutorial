<mat-card>
  <mat-card-header>
    <mat-card-title>Customers</mat-card-title>
  </mat-card-header>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card-content>
    @if (isAdmin()) {
      <div class="page-toolbar">
        <button mat-raised-button color="primary" type="button" (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>
          New customer
        </button>
      </div>
    }

    <app-customer-list
      [customers]="customers()"
      [isAdmin]="isAdmin()"
      (edit)="openEditDialog($event)"
      (delete)="confirmDelete($event)"
    />
  </mat-card-content>
</mat-card>

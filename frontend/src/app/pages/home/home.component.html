<div class="home">
  <div class="page-header">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-subtitle">Overview of your store</p>
  </div>

  <div class="stat-grid">
    <mat-card class="stat-card">
      <mat-card-content class="stat-content">
        <div class="stat-icon stat-icon--blue">
          <mat-icon>category</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-value">N/A</span>
          <span class="stat-label">Categories</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-content class="stat-content">
        <div class="stat-icon stat-icon--green">
          <mat-icon>inventory_2</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-value">N/A</span>
          <span class="stat-label">Products</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-content class="stat-content">
        <div class="stat-icon stat-icon--violet">
          <mat-icon>people</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-value">N/A</span>
          <span class="stat-label">Customers</span>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-content class="stat-content">
        <div class="stat-icon stat-icon--orange">
          <mat-icon>receipt_long</mat-icon>
        </div>
        <div class="stat-body">
          <span class="stat-value">N/A</span>
          <span class="stat-label">Orders</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="bottom-grid">
    <mat-card class="recent-card">
      <mat-card-header>
        <mat-card-title>Recent Orders</mat-card-title>
      </mat-card-header>
      <mat-card-content class="empty-state">
        <mat-icon class="empty-icon">receipt_long</mat-icon>
        <p>No orders yet</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="quick-card">
      <mat-card-header>
        <mat-card-title>Quick Actions</mat-card-title>
      </mat-card-header>
      <mat-card-content class="quick-actions">
        <a mat-stroked-button routerLink="/products">
          <mat-icon>add</mat-icon>
          New Product
        </a>
        <a mat-stroked-button routerLink="/customers">
          <mat-icon>person_add</mat-icon>
          New Customer
        </a>
        <a mat-stroked-button routerLink="/orders">
          <mat-icon>add_shopping_cart</mat-icon>
          New Order
        </a>
        <a mat-stroked-button routerLink="/categories">
          <mat-icon>create_new_folder</mat-icon>
          New Category
        </a>
      </mat-card-content>
    </mat-card>
  </div>
</div>
